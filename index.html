<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent !important;
      overflow: hidden;
      font-family: 'Arial Black', Impact, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
    }

    .ticker-container {
      width: 100vw;
      overflow: hidden;
      white-space: nowrap;
      background: transparent;
      padding: 10px 0;
    }

    .ticker-track {
      display: inline-flex;
      gap: 50px;
      animation: scroll 22s linear infinite;
      will-change: transform;
    }

    .item {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .item img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.8));
    }

    .item span {
      margin-top: 6px;
      color: #ffffff;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 
        2px 2px 0 #000,
       -2px -2px 0 #000,
        2px -2px 0 #000,
       -2px 2px 0 #000,
        0px 2px 4px rgba(0,0,0,0.9);
      text-align: center;
    }

    @keyframes scroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>

  <div class="ticker-container">
    <div class="ticker-track" id="track"></div>
  </div>

  <script>
    // Apuntamos a los archivos dentro de la carpeta "regalos/"
    const regalos = [
      { archivo: "regalos/Unicornio.png", nombre: "UNICORNIO" },
      { archivo: "regalos/Visitando el espacio.png", nombre: "EN EL ESPACIO" },
      { archivo: "regalos/Voto.png", nombre: "VOTO" },
      { archivo: "regalos/Wanda la bruja.png", nombre: "WANDA BRUJA" },
      { archivo: "regalos/Zeus.png", nombre: "ZEUS" }
    ];

    const track = document.getElementById('track');

    function cargarRegalos() {
      // Duplicamos el arreglo 4 veces para garantizar la continuidad horizontal completa
      const listaCompleta = [...regalos, ...regalos, ...regalos, ...regalos];

      listaCompleta.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item';

        div.innerHTML = `
          <img src="${encodeURI(item.archivo)}" alt="${item.nombre}">
          <span>${item.nombre}</span>
        `;
        track.appendChild(div);
      });
    }

    cargarRegalos();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent !important;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Grid fijo para mostrar exactamente 4 elementos alineados */
    .grid-4 {
      display: flex;
      gap: 60px;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      opacity: 1;
      transform: scale(1);
    }

    /* Transición suave al cambiar de lote */
    .grid-4.oculto {
      opacity: 0;
      transform: scale(0.95);
    }

    .item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 160px;
    }

    /* Título (Nombre del regalo) - Arriba */
    .item .titulo {
      margin-bottom: 8px;
      color: #ffffff;
      font-weight: 900;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 
        2px 2px 0 #000,
       -1px -1px 0 #000,
        1px -1px 0 #000,
       -1px 1px 0 #000,
        0px 4px 8px rgba(0, 0, 0, 0.95);
      text-align: center;
      white-space: nowrap;
    }

    /* Icono PNG - Centro */
    .item img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0px 8px 14px rgba(0, 0, 0, 0.85));
    }

    /* Subtítulo (Descripción/Acción) - Abajo en amarillo */
    .item .subtitulo {
      margin-top: 8px;
      color: #ffea00;
      font-weight: 900;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      text-shadow: 
        2px 2px 0 #000,
       -2px -2px 0 #000,
        2px -2px 0 #000,
       -2px 2px 0 #000,
        0px 4px 8px rgba(0, 0, 0, 0.95);
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="grid-4" id="contenedor"></div>
  </div>

  <script>
    // LISTA DE TUS 17 ELEMENTOS
    const regalos = [
      { archivo: "regalos/Unicornio.png", nombre: "UNICORNIO", descripcion: "x3 Zombis" },
      { archivo: "regalos/Visitando el espacio.png", nombre: "ESPACIO", descripcion: "Gravedad Zero" },
      { archivo: "regalos/Voto.png", nombre: "VOTO", descripcion: "Elegir Mapa" },
      { archivo: "regalos/Wanda la bruja.png", nombre: "WANDA BRUJA", descripcion: "Mala Suerte" },
      { archivo: "regalos/Zeus.png", nombre: "ZEUS", descripcion: "Rayo Mortal" },
      { archivo: "regalos/6.png", nombre: "OBJETO 6", descripcion: "Efecto 6" },
      { archivo: "regalos/7.png", nombre: "OBJETO 7", descripcion: "Efecto 7" },
      { archivo: "regalos/8.png", nombre: "OBJETO 8", descripcion: "Efecto 8" },
      { archivo: "regalos/9.png", nombre: "OBJETO 9", descripcion: "Efecto 9" },
      { archivo: "regalos/10.png", nombre: "OBJETO 10", descripcion: "Efecto 10" },
      { archivo: "regalos/11.png", nombre: "OBJETO 11", descripcion: "Efecto 11" },
      { archivo: "regalos/12.png", nombre: "OBJETO 12", descripcion: "Efecto 12" },
      { archivo: "regalos/13.png", nombre: "OBJETO 13", descripcion: "Efecto 13" },
      { archivo: "regalos/14.png", nombre: "OBJETO 14", descripcion: "Efecto 14" },
      { archivo: "regalos/15.png", nombre: "OBJETO 15", descripcion: "Efecto 15" },
      { archivo: "regalos/16.png", nombre: "OBJETO 16", descripcion: "Efecto 16" },
      { archivo: "regalos/17.png", nombre: "OBJETO 17", descripcion: "Efecto 17" }
    ];

    const contenedor = document.getElementById('contenedor');
    let indiceActual = 0;
    const tiempoVisibilidad = 6000; // 6 segundos por grupo

    function mostrarSiguienteGrupo() {
      // 1. Efecto de desvanecimiento
      contenedor.classList.add('oculto');

      setTimeout(() => {
        // 2. Tomar los elementos del lote actual
        let grupo = regalos.slice(indiceActual, indiceActual + 4);

        // Si faltan elementos para llegar a 4 (como pasa al final con el #17)
        if (grupo.length < 4) {
          const faltantes = 4 - grupo.length;
          // Filtrar regalos que no estén ya en el grupo actual
          const disponibles = regalos.filter(r => !grupo.includes(r));
          
          // Mezclar aleatoriamente y seleccionar los que faltan
          const aleatorios = disponibles.sort(() => 0.5 - Math.random()).slice(0, faltantes);
          grupo = [...grupo, ...aleatorios];
        }

        // Renderizar en el DOM
        contenedor.innerHTML = grupo.map(item => `
          <div class="item">
            <span class="titulo">${item.nombre}</span>
            <img src="${encodeURI(item.archivo)}" alt="${item.nombre}">
            <span class="subtitulo">${item.descripcion}</span>
          </div>
        `).join('');

        // 3. Mostrar el nuevo bloque con animación
        contenedor.classList.remove('oculto');

        // Avanzar 4 posiciones o reiniciar al ciclo inicial
        indiceActual += 4;
        if (indiceActual >= regalos.length) {
          indiceActual = 0;
        }
      }, 500);
    }

    // Ejecutar al iniciar
    mostrarSiguienteGrupo();

    // Ciclo automático
    setInterval(mostrarSiguienteGrupo, tiempoVisibilidad);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent !important;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
    }

    .ticker-container {
      width: 100vw;
      overflow: hidden;
      white-space: nowrap;
      background: transparent;
      padding: 12px 0;
    }

    /* Track animado con CSS puro para cero tirones en TikTok LIVE Studio */
    .ticker-track {
      display: inline-flex;
      width: max-content;
      animation: marquee 35s linear infinite;
      will-change: transform;
      backface-visibility: hidden;
      perspective: 1000px;
    }

    .block {
      display: inline-flex;
      gap: 65px;
      padding-right: 65px; /* Mismo espacio para evitar tirones al reiniciar el bucle */
    }

    .item {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Nombre del regalo (ARRIBA) */
    .item .titulo {
      margin-bottom: 6px;
      color: #ffffff;
      font-weight: 900;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 
        2px 2px 0 #000,
       -1px -1px 0 #000,
        1px -1px 0 #000,
       -1px 1px 0 #000,
        0px 4px 8px rgba(0, 0, 0, 0.95);
      text-align: center;
    }

    /* Icono PNG (CENTRO) */
    .item img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0px 6px 12px rgba(0, 0, 0, 0.85));
    }

    /* Descripción/Efecto (ABAJO - Amarillo Grande) */
    .item .subtitulo {
      margin-top: 6px;
      color: #ffea00;
      font-weight: 900;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      text-shadow: 
        2px 2px 0 #000,
       -2px -2px 0 #000,
        2px -2px 0 #000,
       -2px 2px 0 #000,
        0px 4px 8px rgba(0, 0, 0, 0.95);
      text-align: center;
    }

    /* Animación de desplazamiento infinito exacto sin saltos */
    @keyframes marquee {
      0% {
        transform: translate3d(0, 0, 0);
      }
      100% {
        transform: translate3d(-50%, 0, 0);
      }
    }
  </style>
</head>
<body>

  <div class="ticker-container">
    <div class="ticker-track" id="track">
      <div class="block" id="block1"></div>
      <div class="block" id="block2"></div>
    </div>
  </div>

  <script>
    // LISTA DE TUS 17 ELEMENTOS
    const regalos = [
      { archivo: "regalos/Unicornio.png", nombre: "UNICORNIO", descripcion: "x3 Zombis" },
      { archivo: "regalos/Visitando el espacio.png", nombre: "ESPACIO", descripcion: "Gravedad Zero" },
      { archivo: "regalos/Voto.png", nombre: "VOTO", descripcion: "Elegir Mapa" },
      { archivo: "regalos/Wanda la bruja.png", nombre: "WANDA BRUJA", descripcion: "Mala Suerte" },
      { archivo: "regalos/Zeus.png", nombre: "ZEUS", descripcion: "Rayo Mortal" },
      { archivo: "regalos/6.png", nombre: "OBJETO 6", descripcion: "Efecto 6" },
      { archivo: "regalos/7.png", nombre: "OBJETO 7", descripcion: "Efecto 7" },
      { archivo: "regalos/8.png", nombre: "OBJETO 8", descripcion: "Efecto 8" },
      { archivo: "regalos/9.png", nombre: "OBJETO 9", descripcion: "Efecto 9" },
      { archivo: "regalos/10.png", nombre: "OBJETO 10", descripcion: "Efecto 10" },
      { archivo: "regalos/11.png", nombre: "OBJETO 11", descripcion: "Efecto 11" },
      { archivo: "regalos/12.png", nombre: "OBJETO 12", descripcion: "Efecto 12" },
      { archivo: "regalos/13.png", nombre: "OBJETO 13", descripcion: "Efecto 13" },
      { archivo: "regalos/14.png", nombre: "OBJETO 14", descripcion: "Efecto 14" },
      { archivo: "regalos/15.png", nombre: "OBJETO 15", descripcion: "Efecto 15" },
      { archivo: "regalos/16.png", nombre: "OBJETO 16", descripcion: "Efecto 16" },
      { archivo: "regalos/17.png", nombre: "OBJETO 17", descripcion: "Efecto 17" }
    ];

    const block1 = document.getElementById('block1');
    const block2 = document.getElementById('block2');

    function crearHTML(lista) {
      return lista.map(item => `
        <div class="item">
          <span class="titulo">${item.nombre}</span>
          <img src="${encodeURI(item.archivo)}" alt="${item.nombre}">
          <span class="subtitulo">${item.descripcion}</span>
        </div>
      `).join('');
    }

    // Inyectamos el HTML en los dos bloques
    const htmlContenido = crearHTML(regalos);
    block1.innerHTML = htmlContenido;
    block2.innerHTML = htmlContenido;
  </script>

</body>
</html>
